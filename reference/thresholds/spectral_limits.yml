# QC02_SpectralCheck DHR-comparison limits (retired plan §5, DT01 empirical anchors).
# ADVISORY: these grade `warning` on the advisory dhr_bias checks but the
# QC02 run status stays not_evaluated until the ET00/ET03 equivalence test
# and its reference set land. Bias = mean(observed_median − expected_DHR),
# both in reflectance %, so the bias is in reflectance percentage points
# (pp); bad bands masked before the roll-up. Units convention: reflectance
# levels report as %, reflectance differences as pp (the delta_stats
# *_pct JSON keys keep their names for schema stability).
# Anchors (DT01, 60+ tables, correct set pinned): VNIR |bias| reached
# ±0.6 pp on the CaliWeek reference days → ~1.5–2 pp is a realistic limit;
# SWIR masked biases were mostly ±2 pp.
source: DT01_GryfnPanelComparison empirical anchors (APEx_Analysis, 2026-08)

bias_abs_pp:
  VNIR: {warn_above: 2.0}
  SWIR: {warn_above: 2.0}

# Within-day drift of the full-region DHR bias across runs (QA02,
# advisory). Anchors: the CaliWeek reference days held VNIR |bias|
# within ±0.6 pp (≈1.2 pp day-to-day spread); the Narrabri 20260805
# failure walked panel 82 monotonically by 22 pp over runs 01→09
# (brightness-dependent). Uncalibrated between those extremes — revisit
# once QA02 has accumulated background rates.
within_day_drift:
  min_runs: 3
  range_warn_above_pp: 3.0

# QC02 panel-homogeneity thresholds (retired plan §5/§7;
# calibrated 25.08.2026 over all 119
# extracted spectra tables on the node
# store = 448 panel instances; clean reference population =
# 2026_APExCaliWeek, 160 panel instances per EM region). A band flags when
# |skew|, l_kurt (low tail) or |mean-median| crosses its limit; the panel
# grades suspect when the flagged-band fraction crosses
# fraction_bands_warn_above. Advisory: suspect -> warning, run status
# stays not_evaluated.
# Clean-population anchors (CaliWeek, good bands only):
#   VNIR |skew| p95 0.31 / p99 0.54; l_kurt p05 0.096 / p01 0.084;
#        |mean-median| p95 0.15 / p99 0.24 pp
#   SWIR |skew| p95 1.87 / p99 4.43; l_kurt p05 0.049 / p01 0.009;
#        |mean-median| p95 0.41 / p99 1.26 pp
# Verified at these values: VNIR 0/160 CaliWeek false suspects while
# catching every known-bad field case (Narrabri 20260805 VAL-82 0.99,
# TomsCoverCrop 20260723 0.92-0.98); SWIR 1/160 (20260415 run_19 panel 82,
# 0.75 flagged fraction - genuinely inhomogeneous).
homogeneity:
  VNIR:
    abs_skew_warn_above: 0.5
    l_kurt_warn_below: 0.08
    mean_median_divergence_warn_pp: 0.25
    fraction_bands_warn_above: 0.25
  SWIR:
    abs_skew_warn_above: 2.0
    l_kurt_warn_below: 0.01
    mean_median_divergence_warn_pp: 0.5
    fraction_bands_warn_above: 0.5
